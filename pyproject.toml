[project]
name = "vardiya"
version = "0.3.0"
description = "Open, model-agnostic agent harness and benchmark for batch scheduler operations"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vardiya = "vardiya.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vardiya"]

[tool.setuptools.package-data]
vardiya = ["static/*.html"]
